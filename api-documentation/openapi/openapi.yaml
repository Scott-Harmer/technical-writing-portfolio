openapi: 3.1.0

info:
  title: Task Management API
  version: 1.0.0
  description: >
    A fictional REST API for creating, retrieving,
    updating, filtering, and deleting tasks.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: https://api.task-management.invalid/v1
    description: Fictional production server

security:
  - bearerAuth: []

paths:
  /tasks:
    post:
      summary: Create a task
      description: Creates a new task in the task management system.
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  example: Review API documentation
                status:
                  type: string
                  example: in_progress
                priority:
                  type: string
                  example: high
      responses:
        '201':
          description: Task created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid request.

    get:
      summary: Retrieve tasks
      description: Retrieves tasks and optionally filters them by status or project.
      operationId: listTasks
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: projectId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Tasks retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          description: Invalid filter parameters.

  /tasks/{taskId}:
    get:
      summary: Retrieve a task
      description: Retrieves a single task by its unique identifier.
      operationId: getTask
      parameters:
        - name: taskId
          in: path
          required: true
          description: Unique identifier of the task.
          schema:
            type: string
      responses:
        '200':
          description: Task retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found.

    patch:
      summary: Update a task
      description: Updates one or more fields of an existing task.
      operationId: updateTask
      parameters:
        - name: taskId
          in: path
          required: true
          description: Unique identifier of the task.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                status:
                  type: string
                priority:
                  type: string
                projectId:
                  type: string
      responses:
        '200':
          description: Task updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found.

    delete:
      summary: Delete a task
      description: Deletes a task by its unique identifier.
      operationId: deleteTask
      parameters:
        - name: taskId
          in: path
          required: true
          description: Unique identifier of the task.
          schema:
            type: string
      responses:
        '204':
          description: Task deleted successfully.
        '404':
          description: Task not found.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Task:
      type: object
      required:
        - id
        - title
        - status
        - priority
      properties:
        id:
          type: string
          example: task_1024
        title:
          type: string
          example: Review API documentation
        status:
          type: string
          example: in_progress
        priority:
          type: string
          example: high
        projectId:
          type: string
          example: project_210
